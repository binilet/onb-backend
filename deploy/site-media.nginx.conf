# Include inside the HTTPS server block on the host named by MEDIA_BASE_URL.
# Serve only public variants; MEDIA_ROOT/.locks remains inaccessible.
location ^~ /media/site-media/ {
    alias /var/www/hagere-media/site-media/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    types { image/webp webp; }
    default_type application/octet-stream;
    autoindex off;
    limit_except GET HEAD { deny all; }
}

# In the EXISTING FastAPI proxy location, use client_max_body_size 2200k;
# This accommodates a 2 MiB file plus the multipart envelope. FastAPI separately
# enforces the exact 2,097,152-byte FILE limit and a bounded request body.
# Preserve your current proxy_pass; do not route these writes to bingo-server.
